header:
 version: 14
 
machine: rpi02w64
distro: rpi-distro
target: custom-image 
repos:   
   
 openembedded-core:
  url: https://git.openembedded.org/openembedded-core
  branch: scarthgap
  path: openembedded-core
  layers:
   meta:
  
  
 bitbake:
  url: https://git.openembedded.org/bitbake
  path: openembedded-core/bitbake
  branch: "2.8"
  layers:
   bitbake: disabled
    
      
 meta-raspberyypi: 
  url: https://git.yoctoproject.org/meta-raspberrypi
  branch: scarthgap
  path: meta-raspberrypi   
  
  
 meta-openembedded:
  url: https://git.openembedded.org/meta-openembedded
  branch: scarthgap
  path: meta-openembedded
  layers:
   meta-oe:
  

 meta-rpi-distro:
  path: meta-rpi-distro
  
 meta-rpi-bsp:
  path: meta-rpi-bsp
 meta-rpi-software:
  path: meta-rpi-software

  
bblayers_conf_header:
  standard: |
    POKY_BBLAYERS_CONF_VERSION = "2"
    BBPATH = "${TOPDIR}"
    BBFILES ?= ""
local_conf_header:
  standard: |
    CONF_VERSION = "2"
    USER_CLASSES = "buildstats"
    PATCHRESOLVE = "noop"
    
  downloads-and-cache: |
    DL_DIR= "${HOME}/project/downloads"  
    SSTATE_DIR = "${HOME}/project/sstate-cache"
  diskmon: |
    BB_DISKMON_DIRS = "\
        STOPTASKS,${TMPDIR},1G,100K \
        STOPTASKS,${DL_DIR},1G,100K \
        STOPTASKS,${SSTATE_DIR},1G,100K \
        STOPTASKS,/tmp,100M,100K \
        HALT,${TMPDIR},100M,1K \
        HALT,${DL_DIR},100M,1K \
        HALT,${SSTATE_DIR},100M,1K \
        HALT,/tmp,10M,1K"  
  
  
  
   
