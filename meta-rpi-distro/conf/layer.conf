# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-rpi-disto"
BBFILE_PATTERN_meta-rpi-disto = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-rpi-disto = "6"

LAYERDEPENDS_meta-rpi-disto = "core"
LAYERSERIES_COMPAT_meta-rpi-disto = "scarthgap"
