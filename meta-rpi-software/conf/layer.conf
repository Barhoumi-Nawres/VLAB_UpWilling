# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-rpi-software"
BBFILE_PATTERN_meta-rpi-software = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-rpi-software = "6"

LAYERDEPENDS_meta-rpi-software = "core"
LAYERSERIES_COMPAT_meta-rpi-software = "scarthgap"
